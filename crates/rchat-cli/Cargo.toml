[package]
name = "rchat-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rchat-core.workspace = true
rchat-proto.workspace = true
rchat-client-storage-sqlite.workspace = true
rchat-crypto-provider.workspace = true
rchat-transport-ws.workspace = true
clap = { workspace = true, features = ["env"] }
directories.workspace = true
rpassword.workspace = true
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[[bin]]
name = "rchat-cli"
path = "src/main.rs"

[dev-dependencies]
rchat-testkit.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "process",
    "net",
    "io-util",
] }
