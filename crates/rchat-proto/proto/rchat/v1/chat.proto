syntax = "proto3";

package rchat.proto.v1;

import "rchat/v1/common.proto";

enum ChatKind {
  CHAT_KIND_UNSPECIFIED = 0;
  CHAT_KIND_DIRECT = 1;
  CHAT_KIND_GROUP = 2;
}

// Роль участника в групповом чате. В личных чатах не заполняется.
enum ChatMemberRole {
  CHAT_MEMBER_ROLE_UNSPECIFIED = 0;
  CHAT_MEMBER_ROLE_MEMBER = 1;
  // Владелец: может исключать участников и переименовывать чат.
  // У группы всегда ровно один владелец.
  CHAT_MEMBER_ROLE_OWNER = 2;
}

// Режим конфиденциальности чата. Фиксируется при создании и не меняется
// автоматически: переход E2E -> plaintext запрещён.
enum E2eMode {
  E2E_MODE_UNSPECIFIED = 0;
  // Явный режим разработки без E2E. Сервер и клиент могут видеть содержимое.
  // Может использоваться только по явному указанию пользователя/тестов.
  E2E_MODE_NONE_DEV = 1;
  // Сквозное шифрование olm.v1.
  E2E_MODE_OLM_V1 = 2;
  // Облачный режим: содержимое шифруется ключом аккаунта, который знает
  // сервер (как в облачных чатах Telegram): сервер может индексировать
  // сообщения и отдать историю новому устройству аккаунта.
  E2E_MODE_CLOUD = 3;
}

message ChatMember {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  uint64 joined_at_ms = 4;
  ChatMemberRole role = 5;
}

message Chat {
  string chat_id = 1;
  ChatKind kind = 2;
  E2eMode e2e_mode = 3;
  repeated ChatMember members = 4;
  uint64 created_at_ms = 5;
  uint64 updated_at_ms = 6;
  // Последний server_id сообщения в чате (0, если сообщений нет).
  uint64 last_server_id = 7;
  // Ключ облачного чата: им зашифровано содержимое сообщений. В
  // E2E-чатах пусто; в облачных — сервер знает ключ (в этом суть
  // облачного режима) и отдаёт его всем устройствам участников.
  bytes cloud_key = 9;
  // Название группового чата; пусто для личных чатов.
  string name = 8;
}

message CreateDirectChatRequest {
  string peer_username = 1;
  // Режим требуется указать явно; E2E_MODE_UNSPECIFIED отклоняется.
  E2eMode e2e_mode = 2;
}

message CreateDirectChatResponse {
  Chat chat = 1;
}

message ListChatsRequest {}

message ListChatsResponse {
  repeated Chat chats = 1;
}

// ---------------------------------------------------------------------------
// Групповые чаты.
//
// Модель участия: приглашение без подтверждения (invite = immediate
// membership). Приглашать может любой участник; исключать и переименовывать —
// только владелец. Владелец — создатель; если владелец выходит, владение
// переходит участнику с самым ранним joined_at_ms.
// ---------------------------------------------------------------------------

message CreateGroupChatRequest {
  string name = 1;
  // Логины приглашаемых участников (без учёта регистра, кроме создателя).
  repeated string member_usernames = 2;
  // Режим требуется указать явно; E2E_MODE_UNSPECIFIED отклоняется.
  E2eMode e2e_mode = 3;
}

message CreateGroupChatResponse {
  Chat chat = 1;
}

message InviteToChatRequest {
  string chat_id = 1;
  repeated string usernames = 2;
}

message InviteToChatResponse {
  Chat chat = 1;
}

message LeaveChatRequest {
  string chat_id = 1;
}

message LeaveChatResponse {}

// Исключение участника владельцем. Владельца исключить нельзя; для выхода
// владельца используется LeaveChat.
message RemoveChatMemberRequest {
  string chat_id = 1;
  string user_id = 2;
}

message RemoveChatMemberResponse {
  Chat chat = 1;
}

message RenameChatRequest {
  string chat_id = 1;
  string name = 2;
}

message RenameChatResponse {
  Chat chat = 1;
}
