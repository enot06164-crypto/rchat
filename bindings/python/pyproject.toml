[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rchat"
version = "0.1.0"
description = "Zero-dependency Python SDK for the rchat C ABI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "rchat contributors" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# Local WebSocket gateway (`python3 -m rchat.gateway`), not used by the SDK.
gateway = ["websockets>=12"]

[tool.setuptools]
packages = ["rchat"]
