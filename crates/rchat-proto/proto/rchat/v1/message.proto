syntax = "proto3";

package rchat.proto.v1;

import "rchat/v1/chat.proto";

// Тип сообщения olm (из библиотеки-провайдера): первый prekey-пакет создаёт
// входящую сессию у получателя, последующие — обычные.
enum OlmMessageType {
  OLM_MESSAGE_TYPE_NORMAL = 0;
  OLM_MESSAGE_TYPE_PREKEY = 1;
}

// Что зашифровано в ciphertext конкретной копии (для одного устройства).
enum RecipientPayloadKind {
  // Обычное содержимое сообщения (личные E2E-чаты).
  RECIPIENT_PAYLOAD_KIND_MESSAGE = 0;
  // Ключ групповой (Megolm) сессии для этого устройства: Olm-конверт, внутри
  // которого бинарный GroupKeyPayload (формат — зона ответственности
  // E2E-провайдера). Используется только в групповых E2E-чатах.
  RECIPIENT_PAYLOAD_KIND_GROUP_KEY = 1;
}

// Зашифрованная копия сообщения для одного конкретного устройства получателя.
message RecipientPayload {
  string device_id = 1;
  bytes ciphertext = 2;
  // 1 = olm.v1.
  uint32 e2e_version = 3;
  OlmMessageType olm_type = 4;
  // curve25519 identity key отправителя (для создания входящей сессии).
  bytes sender_curve25519 = 5;
  RecipientPayloadKind payload_kind = 6;
}

// Сообщение, как его видит запрашивающее устройство.
message Message {
  uint64 server_id = 1;
  string chat_id = 2;
  string sender_user_id = 3;
  string sender_device_id = 4;
  string client_message_id = 5;
  // "text" на первом этапе.
  string content_kind = 6;
  uint64 reply_to_server_id = 7;
  uint64 created_at_ms = 8;
  uint64 edited_at_ms = 9;
  uint64 deleted_at_ms = 10;
  // Ciphertext для запрашивающего устройства. Пусто, если для этого устройства
  // копии нет (например, устройство зарегистрировано позже отправки).
  bytes ciphertext = 11;
  uint32 e2e_version = 12;
  // Открытый текст. Присутствует только в чатах E2E_MODE_NONE_DEV.
  string plaintext_dev = 13;
  // curve25519 identity key отправителя на момент отправки: нужен получателю
  // для создания входящей сессии. Сверяется с кешем устройства.
  bytes sender_curve25519 = 14;
  OlmMessageType olm_type = 15;
  // Megolm-ciphertext группового E2E-сообщения: одинаков для всех устройств.
  // Пусто для личных чатов и dev-сообщений.
  bytes group_ciphertext = 16;
  // Идентификатор Megolm-сессии (base64), которой зашифрован group_ciphertext.
  string group_session_id = 17;
  // Вид ciphertext для запрашивающего устройства (RecipientPayloadKind).
  // При пустом ciphertext не значим.
  RecipientPayloadKind recipient_payload_kind = 18;
}

message SendMessageRequest {
  string chat_id = 1;
  // Клиентский ключ идемпотентности (локальный ID сообщения).
  // Повтор с тем же ключом возвращает результат первой отправки.
  string client_message_id = 2;
  string content_kind = 3;
  uint64 reply_to_server_id = 4;
  // Копии для устройств всех участников чата (кроме устройства отправителя).
  // Для личного E2E-чата обязаны покрывать все неотозванные E2E-устройства
  // участников. Для группового E2E-чата — это доставка ключа Megolm-сессии
  // (payload_kind = GROUP_KEY) тем устройствам, у которых его ещё нет; полное
  // покрытие не требуется.
  repeated RecipientPayload recipients = 5;
  // Только для чатов E2E_MODE_NONE_DEV; в E2E-чате отклоняется.
  string plaintext_dev = 6;
  // Для группового E2E-чата: megolm-ciphertext (обязателен) и идентификатор
  // сессии. Для личных E2E-чатов должны быть пустыми.
  bytes group_ciphertext = 7;
  string group_session_id = 8;
}

message SendMessageResponse {
  Message message = 1;
}

message GetHistoryRequest {
  string chat_id = 1;
  // 0 — с последних сообщений; иначе строго старее указанного server_id.
  uint64 before_server_id = 2;
  uint32 limit = 3;
}

message GetHistoryResponse {
  // Сообщения в порядке убывания server_id (новые первыми).
  repeated Message messages = 1;
  bool has_more = 2;
}

message EditMessageRequest {
  uint64 server_id = 1;
  string content_kind = 2;
  // Семантика как в SendMessageRequest: в личном E2E-чате — полное покрытие,
  // в групповом — доставка ключа и общий megolm-ciphertext.
  repeated RecipientPayload recipients = 3;
  string plaintext_dev = 4;
  bytes group_ciphertext = 5;
  string group_session_id = 6;
}

message EditMessageResponse {
  Message message = 1;
}

// Удаление для всех участников (tombstone). Политика зафиксирована:
// удаление «только для себя» в MVP не поддерживается.
message DeleteMessageRequest {
  uint64 server_id = 1;
}

message DeleteMessageResponse {
  Message message = 1;
}

// Подтверждение: delivered (read=false) — устройство применило сообщения
// до up_to_server_id; read=true — пользователь прочитал.
message MarkReceiptRequest {
  string chat_id = 1;
  uint64 up_to_server_id = 2;
  bool read = 3;
}

message MarkReceiptResponse {}
