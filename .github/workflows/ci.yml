name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, тесты, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # protoc нужен prost-build для кодогенерации из .proto (rchat-proto).
      - name: Установка protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '29.3'
          repo-token: ${{ github.token }}

      # Версия закреплена файлом rust-toolchain.toml (stable + rustfmt/clippy).
      - name: Установка Rust
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt --component clippy
          rustup default stable

      - name: Кеш cargo
        uses: Swatinem/rust-cache@v2

      - name: Форматирование
        run: cargo fmt --all -- --check

      - name: Clippy (предупреждения — ошибки)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Тесты
        run: cargo test --locked --workspace

      - name: Проверка JSON Schema
        run: cargo run --locked -p rchat-ffi --bin export_schema -- --check

      - name: Сборка исполняемых целей
        run: cargo build --locked --bin rchat-server --bin rchat-cli

      - name: C-ABI smoke
        run: |
          cargo build --locked -p rchat-ffi
          rm -rf /tmp/rchat-ffi-smoke-data
          cc -std=c11 -Wall -Wextra \
            -I crates/rchat-ffi/include \
            crates/rchat-ffi/examples/ffi_smoke.c \
            -L target/debug -lrchat_ffi -o /tmp/rchat-ffi-smoke
          LD_LIBRARY_PATH=target/debug /tmp/rchat-ffi-smoke

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python SDK tests
        run: |
          cargo build --locked -p rchat-ffi
          cargo build --locked --bin rchat-server
          # Локальному шлюзу нужен websockets (опциональная зависимость пакета).
          python3 -m pip install --quiet "websockets>=12"
          python3 -m unittest discover -s bindings/python/tests

      - name: Сборка веб-клиента (этап H)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm ci + build веб-клиента
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          npm test
