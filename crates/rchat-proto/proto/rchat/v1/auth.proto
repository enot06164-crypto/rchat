syntax = "proto3";

package rchat.proto.v1;

import "rchat/v1/common.proto";

// Регистрация создаёт пользователя и первое устройство одной транзакцией.
// Устройство может не иметь E2E-ключей (e2e_version = 0) — такое устройство
// не сможет участвовать в E2E-чатах.
message RegisterRequest {
  string username = 1;
  string display_name = 2;
  string password = 3;
  DeviceInfo device = 4;
  repeated PreKey one_time_keys = 5;
  PreKey fallback_key = 6;
}

message RegisterResponse {
  string user_id = 1;
  string session_token = 2;
  uint64 session_expires_at_ms = 3;
  DeviceInfo device = 4;
}

// Вход. Если устройства с таким device_id у пользователя ещё нет — оно
// создаётся. Если есть — набор ключей должен совпадать, иначе конфликт.
message LoginRequest {
  string username = 1;
  string password = 2;
  DeviceInfo device = 3;
  repeated PreKey one_time_keys = 4;
  PreKey fallback_key = 5;
}

message LoginResponse {
  string user_id = 1;
  string session_token = 2;
  uint64 session_expires_at_ms = 3;
  DeviceInfo device = 4;
  // Все устройства пользователя (кроме отозванных).
  repeated DeviceInfo devices = 5;
}

// Восстановление сохранённой сессии по непрозрачному токену.
message ResumeRequest {
  string session_token = 1;
}

message ResumeResponse {
  UserInfo user = 1;
  DeviceInfo device = 2;
  uint64 session_expires_at_ms = 3;
}

message LogoutRequest {}

message LogoutResponse {}

message GetMeRequest {}

message GetMeResponse {
  UserInfo user = 1;
  DeviceInfo device = 2;
}

// Дополнение пула одноразовых prekey и/или обновление резервного ключа.
message UploadKeysRequest {
  repeated PreKey one_time_keys = 1;
  PreKey fallback_key = 2;
  uint32 e2e_version = 3;
}

message UploadKeysResponse {
  uint32 stored_one_time_keys = 1;
}

// Получение пакетов ключей для установления сессии. Одноразовый prekey
// выделяется сервером каждому запрошенному устройству (at most once).
message GetDeviceBundlesRequest {
  repeated string device_ids = 1;
}

message GetDeviceBundlesResponse {
  repeated DeviceBundle bundles = 1;
}

// Список устройств указанных пользователей (без выделения prekey).
message GetDevicesRequest {
  repeated string user_ids = 1;
  bool include_own = 2;
}

message GetDevicesResponse {
  repeated DeviceInfo devices = 1;
}

message ListDevicesRequest {}

message ListDevicesResponse {
  repeated DeviceInfo devices = 1;
}

// Поиск пользователей по префиксу username (как поиск контактов в
// Telegram).  Нужен, чтобы в новом чате можно было выбрать собеседника по
// напечатанному имени, а не по точному совпадению.
message SearchUsersRequest {
  // Префикс username (регистр не важен).
  string query = 1;
  // Максимум результатов (по умолчанию 20).
  uint32 limit = 2;
}

message SearchUsersResponse {
  repeated UserInfo users = 1;
}

// Запрос собеседнику перевести личный чат в приватный режим (E2E) или
// вернуть его в обычный (облачный).
message RequestPrivateModeRequest {
  string chat_id = 1;
  // `true` — включить приватный режим, `false` — выключить его.
  bool enable = 2;
}

message RequestPrivateModeResponse {
  // `true` — запрос уже отправлен и ждёт подтверждения.
  bool pending = 1;
}

// Отзыв собственного запроса.
message CancelPrivateModeRequest {
  string chat_id = 1;
}

message CancelPrivateModeResponse {}

// Ответ на запрос: принять (перевести чат в E2E) или отклонить.
message ResolvePrivateModeRequest {
  string chat_id = 1;
  bool accept = 2;
}

message ResolvePrivateModeResponse {
  // `true` — чат переведён в приватный режим.
  bool switched = 1;
}

message RevokeDeviceRequest {
  string device_id = 1;
}

message RevokeDeviceResponse {}

// Ключ аккаунта для облачного режима: им шифруются файлы, заливаемые на
// сервер. Сервер знает ключ, поэтому может хранить файл (как DC Telegram)
// и отдавать его участникам чата.
message SetCloudAccountKeyRequest {
  // Ключ аккаунта (32 байта).
  bytes key = 1;
}

message SetCloudAccountKeyResponse {
  // Действующий ключ аккаунта: сервер отдаёт уже сохранённый, если он есть
  // (иначе — принятый), чтобы все устройства аккаунта совпадали.
  bytes key = 1;
}

// Поиск по сообщениям аккаунта (только облачный режим: сервер расшифровывает
// содержимое ключом аккаунта).
message SearchMessagesRequest {
  // Строка запроса (регистронезависимо).
  string query = 1;
  // Ограничение числа ответов.
  uint32 limit = 2;
}

message SearchMessagesResponse {
  repeated SearchHit hits = 1;
}

message SearchHit {
  string chat_id = 1;
  uint64 server_id = 2;
  string body = 3;
  uint64 created_at_ms = 4;
  // Имя чата (для показа в выдаче).
  string chat_title = 5;
}
